[workspace]
# Declared explicitly because path dependencies are NOT members by default:
# without this, `cargo test --workspace` built flow-paths but ran none of its
# tests.
#
# The console stays out on purpose - it is its own workspace root, and CI runs
# it as a separate step.
members = [".", "crates/flow-paths"]
exclude = ["crates/console"]

[package]
name = "flow"
version = "0.4.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.1"
encoding_rs = "0.8.35"
evdev = "0.13.2"
flow-paths = { path = "crates/flow-paths" }
hound = "3.5.1"
libc = "0.2.189"
serde_json = "1.0.151"
realfft = "3.5.0"
rubato = "5.0.1"
signal-hook = "0.4.4"
whatlang = "0.18.0"
fontdue = "0.9.4"
png = "0.18.1"
parakeet-rs = "0.3.7"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9.3"
# `blocking` is only the API shape - it enables no reactor, so zbus underneath
# it will not build alone. `async-io` is the runtime, chosen over tokio because
# the daemon has no async anywhere else and this way it does not gain one: the
# tray owns its thread and the rest of the process never sees it.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
dispatch2 = "0.3.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSGeometry", "NSString"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation"] }

# Line tables instead of full DWARF. Backtraces still name file and line,
# which is all the daemon's panics are ever read for, but the debug binaries
# stop carrying every type and every dependency's symbols: `target/debug` was
# 47G with a dozen ~300MB copies of the same binary piled up in `deps/`, and
# cargo never collects those. Raise to 2 only while actually stepping through
# a crate in a debugger.
[profile.dev]
debug = 1

# Dependencies optimised even in a debug build; this crate left alone.
#
# This existed for llama.cpp and parakeet, which at opt-level 0 turned a
# two-second transcription into most of a minute. Both are gone and inference
# is a network call now, so the override buys much less - kept because the
# audio and resampling crates on the capture path are still real work, and
# dropping it is a build-time measurement nobody has made yet.
[profile.dev.package."*"]
opt-level = 3
