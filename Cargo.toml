[workspace]
# Declared explicitly because path dependencies are NOT members by default:
# without this, `cargo test --workspace` built flow-paths but ran none of its
# tests.
#
# The console stays out on purpose - it is its own workspace root so that
# iced's tree and llama.cpp's tree are never resolved together. CI runs it as
# a separate step.
members = [".", "crates/flow-paths"]
exclude = ["crates/console"]

[package]
name = "flow"
version = "0.1.3-alpha.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.1"
encoding_rs = "0.8.35"
evdev = "0.13.2"
flow-paths = { path = "crates/flow-paths" }
hound = "3.5.1"
libc = "0.2.189"
llama-cpp-2 = { version = "0.1.154", features = ["vulkan"] }
parakeet-rs = "0.3.7"
serde_json = "1.0.151"
realfft = "3.5.0"
signal-hook = "0.4.4"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9.3"
nnnoiseless = { version = "0.5", default-features = false }
rubato = "0.15"
whatlang = "0.18.0"
fontdue = "0.9.4"
# `blocking` is only the API shape - it enables no reactor, so zbus underneath
# it will not build alone. `async-io` is the runtime, chosen over tokio because
# the daemon has no async anywhere else and this way it does not gain one: the
# tray owns its thread and the rest of the process never sees it.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
png = "0.18.1"

# Line tables instead of full DWARF. Backtraces still name file and line,
# which is all the daemon's panics are ever read for, but the debug binaries
# stop carrying every type and every dependency's symbols: `target/debug` was
# 47G with a dozen ~300MB copies of the same binary piled up in `deps/`, and
# cargo never collects those. Raise to 2 only while actually stepping through
# a crate in a debugger.
[profile.dev]
debug = 1

# Dependencies optimised even in a debug build; this crate left alone.
#
# Without this `flow-dev` is a toy: llama.cpp and parakeet built at opt-level 0
# turn a two-second transcription into most of a minute, and a dictation you
# have to wait out is not a dictation you can judge the feel of. They are
# third-party and never stepped through, so there is nothing to lose by
# optimising them - and this crate stays at 0, which is what keeps the edit to
# on-screen loop at a few seconds.
[profile.dev.package."*"]
opt-level = 3
