# Not cargo-dist, deliberately. It packages one workspace, and the console is
# its own workspace root on purpose - a dist release would ship the daemon and
# silently leave the window behind. This does both, and the tarball is laid out
# so packaging/install.sh installs it without a compiler.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Same set as CI: llama-cpp-2 builds llama.cpp with the vulkan feature on,
      # cpal wants ALSA, wayland-client wants libwayland. The resulting binary
      # links these at runtime too, so the machine installing it needs the
      # runtime halves - which any Wayland desktop already has.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libvulkan-dev \
            spirv-headers \
            glslc \
            libwayland-dev \
            libxkbcommon-dev \
            libclang-dev \
            cmake \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/console
          # The same cache CI fills on main. A tag ref can read main's caches
          # and nothing else, so this restores; saving would write 700MB under
          # a tag that is never built from again, which is what the four dead
          # caches sitting in this repo already are.
          shared-key: build
          save-if: false

      # The daemon and the console are separate workspace roots that ship as
      # one tarball, so a release where they disagree is a release that reports
      # a version nobody built. Nothing else compares them.
      - name: Version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for manifest in Cargo.toml crates/console/Cargo.toml; do
            found=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)
            if [ "$found" != "$expected" ]; then
              echo "$manifest is $found, tag is $expected" >&2
              exit 1
            fi
          done

      - name: Channel matches the tag
        run: |
          channel=$(cat packaging/channel)
          case "$GITHUB_REF_NAME:$channel" in
            v*-experimental.*:experimental) ;;
            v*-*:*) exit 1 ;;
            v*:stable) ;;
            *) exit 1 ;;
          esac
          python3 tests/packaging_channels.py

      # A tag can point anywhere, including a branch CI never saw. Building an
      # untested binary is cheap; shipping one is not.
      # --release so the tests and the shipped binary share one set of
      # artifacts. Under the debug profile this built llama.cpp twice and put
      # the release job from 11 minutes to 24.
      - name: Test
        run: |
          cargo test --release --workspace
          cargo test --release --manifest-path crates/console/Cargo.toml

      - name: Build
        run: |
          cargo build --release
          cargo build --release --manifest-path crates/console/Cargo.toml

      # Laid out so that packaging/install.sh, unpacked here as-is, finds the
      # binaries in bin/ and skips the build. One install path for a tarball and
      # a git checkout rather than two that can drift.
      - name: Package
        run: |
          name="flow-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$name/bin"
          cp target/release/flow "$name/bin/"
          cp crates/console/target/release/flow-console "$name/bin/"
          cp -r packaging "$name/"
          cp README.md TROUBLESHOOTING.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      # Ships as a draft: the binary is built from the tag, but nobody has run
      # it yet. Publishing is a decision, and it belongs to whoever checked.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SemVer: anything with a hyphen after the patch is a pre-release.
          # Read off the tag rather than a flag someone sets by hand, because
          # the tag is what the version check above already agreed with.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          # `gh release create` on a tag that already has a release does not
          # fail - it makes a second, untagged draft. Re-pushing v0.1.0 through
          # v0.1.2 on 2026-08-23 is where the orphan draft beside v0.1.2 came
          # from. Nothing here can tell a re-push from a first push, so refuse.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release - delete it, or tag a new version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            $prerelease \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            flow-*.tar.gz flow-*.tar.gz.sha256

  # After the Linux job, which owns the version and channel checks and creates
  # the draft this only adds to.
  macos:
    needs: release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/console
          shared-key: build-macos
          save-if: false

      - name: Test
        run: |
          cargo test --release --workspace
          cargo test --release --manifest-path crates/console/Cargo.toml

      - name: Build
        run: |
          cargo build --release
          cargo build --release --manifest-path crates/console/Cargo.toml

      # The same certificate on every release is what keeps macOS's microphone,
      # Input Monitoring and Accessibility grants across updates - see
      # packaging/macos/bundle.sh.
      - name: Bundle and sign Flow.app
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          export FLOW_SIGNING_P12="$RUNNER_TEMP/flow-signing.p12"
          export FLOW_SIGNING_PASSWORD_FILE="$RUNNER_TEMP/p12.pass"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$FLOW_SIGNING_P12"
          printf '%s' "$MACOS_SIGNING_PASSWORD" > "$FLOW_SIGNING_PASSWORD_FILE"
          name="flow-${GITHUB_REF_NAME}-aarch64-macos"
          mkdir -p "$name"
          bash packaging/macos/bundle.sh target/release/flow \
            crates/console/target/release/flow-console "${GITHUB_REF_NAME#v}" "$name"
          codesign -d -r- "$name/Flow.app/Contents/MacOS/flow" 2>&1 | grep -q 'certificate root' || {
            echo "Flow.app was not signed with the release certificate" >&2
            exit 1
          }
          rm -f "$FLOW_SIGNING_P12" "$FLOW_SIGNING_PASSWORD_FILE"

      # Laid out like the Linux tarball, with Flow.app where that has bin/:
      # packaging/install.sh installs the prebuilt app when it finds one.
      - name: Package
        run: |
          name="flow-${GITHUB_REF_NAME}-aarch64-macos"
          cp -R packaging "$name/"
          cp README.md TROUBLESHOOTING.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Add to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" flow-*-aarch64-macos.tar.gz flow-*-aarch64-macos.tar.gz.sha256
