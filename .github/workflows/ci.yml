name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # llama-cpp-2 compiles llama.cpp from source and needs the Vulkan headers,
      # glslc and the SPIRV headers even though nothing here runs a shader: the
      # feature is on in Cargo.toml, so the build wants them whether or not a GPU
      # exists. cpal wants ALSA, wayland-client wants libwayland.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libvulkan-dev \
            spirv-headers \
            glslc \
            libwayland-dev \
            libxkbcommon-dev \
            libclang-dev \
            cmake \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins the version; this action installs the
          # components it asks for.
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The console is a separate workspace root (iced pulls wgpu, which the
          # daemon must not link), so its target dir needs caching on its own.
          workspaces: |
            .
            crates/console

      # --all-targets is the point of this job. tests/chord_live.rs stopped
      # compiling at 6dfbdba and went unnoticed for six commits, because one
      # broken test target fails the whole `cargo test` run and nobody ran it.
      #
      # --workspace only means anything because the root Cargo.toml now lists
      # its members: path dependencies are not members by default, so this
      # used to build the path crates and run none of their tests.
      - name: Build tests (daemon)
        run: cargo test --workspace --all-targets --no-run

      - name: Test (daemon)
        run: cargo test --workspace

      - name: Clippy (daemon)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (console)
        working-directory: crates/console
        run: cargo test

      - name: Clippy (console)
        working-directory: crates/console
        run: cargo clippy --all-targets -- -D warnings

      # The desktop entry is product surface and nothing else compiles it. It
      # already shipped with three main categories, which put Flow in three
      # menus at once - a validator catches that and a reviewer does not.
      - name: Packaging
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/flow-console.desktop
          bash -n packaging/install.sh
          bash -n packaging/uninstall.sh
