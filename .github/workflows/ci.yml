name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # llama-cpp-2 compiles llama.cpp from source and needs the Vulkan headers,
      # glslc and the SPIRV headers even though nothing here runs a shader: the
      # feature is on in Cargo.toml, so the build wants them whether or not a GPU
      # exists. cpal wants ALSA, wayland-client wants libwayland.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libvulkan-dev \
            spirv-headers \
            glslc \
            libwayland-dev \
            libxkbcommon-dev \
            libclang-dev \
            cmake \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins the version; this action installs the
          # components it asks for.
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The console is a separate workspace root (iced pulls wgpu, which the
          # daemon must not link), so its target dir needs caching on its own.
          workspaces: |
            .
            crates/console
          # Named rather than keyed off the job, so the release workflow can ask
          # for the same cache. Without this the two jobs write under `check`
          # and `release` and neither can ever read the other's.
          shared-key: build
          # Only main's caches are readable from another ref, so a cache saved
          # on a pull request or a tag can be read by nothing but the run that
          # wrote it. Save on main, restore everywhere.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # scripts/check holds the steps: format, build and test both workspace
      # roots, clippy, and the packaging validators. --all-targets is the point:
      # tests/chord_live.rs stopped compiling at 6dfbdba and went unnoticed for
      # six commits, because one broken test target fails the whole `cargo test`
      # run and nobody ran it. --workspace only means anything because the root
      # Cargo.toml lists its members: path dependencies are not members by default.
      - name: Check
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          scripts/check

      # llama.cpp takes twelve minutes to compile and the release profile builds
      # it again from scratch, so main pays that once and every tag restores it.
      # Cutting a release used to repeat the whole build because a tag ref can
      # read no cache but its own.
      - name: Warm the release cache
        if: github.ref == 'refs/heads/main'
        run: |
          cargo build --release
          cargo build --release --manifest-path crates/console/Cargo.toml

  # The macOS half of the daemon and console only compiles on a Mac, so the
  # Linux job cannot see a change that breaks it. Not a required check: it
  # guards the port without making every Linux change wait on a second runner.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/console
          # Named for the image: build scripts record absolute Xcode paths, so
          # a cache saved on another image links against an Xcode not there.
          shared-key: build-macos-15
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test (daemon)
        run: cargo test --workspace

      - name: Clippy (daemon)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (console)
        working-directory: crates/console
        run: cargo test

      - name: Clippy (console)
        working-directory: crates/console
        run: cargo clippy --all-targets -- -D warnings
