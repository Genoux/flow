# Flow's config, at ~/.config/flow/config.toml. It behaves the same with or
# without this file: every key below is shown at its built-in default and
# commented out, so uncomment only what you want to change. Deleting the whole
# file is also fine.
#
# Command-line flags win over this file, so `flow daemon --raw` still overrides
# refining for a one-off comparison without editing anything.
#
# Word fixes live next door in ~/.config/flow/vocabulary.txt, not here.

# On, hold the chord while you speak. Off, tap to start and tap to stop.
# push_to_talk = true

# The combination to hold. Flow watches the keyboard directly, so this needs no
# compositor setup - though a compositor bind calling `flow start` still works.
#
# Super is the same key whether the cap says Windows or Command, so this reaches
# every keyboard. Change it if your desktop already uses it: modifiers are
# super, shift, ctrl, alt (meta/win/cmd and option are accepted too), and the
# last part is the key you press - a letter, a digit, f1-f12, space, tab, enter,
# or a named modifier on its own like rightctrl.
# hotkey = super+shift+d

# Volume of other apps while recording, as a percentage of where each one
# already sits, so a quiet app is never raised. 0 turns ducking off. Low enough
# keeps the speakers out of the microphone; too low just mutes your music.
# duck = 50

# Pass the raw transcript through the local refining model. This is the point of
# the tool, so off is only for comparing against what the recogniser heard.
# refine = true

# Type the text out key by key instead of pasting it. Slower, but terminals that
# ignore the clipboard need it.
# terminal = false

# Which GPU runs the refining model. Left unset, Flow picks the discrete card with
# the most free memory, and falls back to the CPU if none can hold the model.
# Set an index only to override that; `flow daemon` logs the one it chose.
# gpu = 0

# Run the microphone through noise suppression before the recogniser sees it.
# Off because it is not free: it removes room noise, and it has also been caught
# removing a word. Turn it on with record_debug below and compare with
# `flow retry` before trusting it on your own hardware.
# denoise = false

# Keep every dictation's audio under ~/.local/share/flow/recordings, one raw
# file and, with denoise on, its denoised twin. This is what `flow retry` reads;
# without it there is nothing to replay and no way to answer "why did I get that
# text". Off by default because long sessions add up on disk fast.
# record_debug = false
