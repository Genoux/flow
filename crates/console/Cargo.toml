[package]
name = "offhand-console"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "Status and settings window for the Offhand dictation daemon"

# Its own workspace root on purpose: iced pulls in wgpu, and the daemon must
# never carry that dependency tree.
[workspace]

[dependencies]
iced = { version = "0.14", features = ["canvas", "advanced", "image-without-codecs"] }
# iced 0.14 gates its allocation re-export behind all image codecs.
iced_runtime = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde_json = "1.0"
semver = "1"
offhand-paths = { path = "../offhand-paths" }

# Linux-only, and the only dependency here that is: evdev is the chord picker
# reading /dev/input. Keeping it off other platforms is what lets the window
# build on a Mac for design work - see the `chord` module in main.rs.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
evdev = "0.13"

# The unified title bar (`titlebar.rs`), which iced has no setting for. The
# same versions winit already builds against, so nothing new is compiled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSToolbar", "NSView", "NSWindow"] }

[[bin]]
name = "offhand-console"
path = "src/main.rs"

# Line tables instead of full DWARF - see the root Cargo.toml for why. It
# matters more here than there: iced drags in wgpu, and this target directory
# reached 11G on its own.
[profile.dev]
debug = 1
