[package]
name = "flow-console"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Status and settings window for the Flow dictation daemon"

# Its own workspace root on purpose: iced pulls in wgpu, and the daemon must
# never carry that dependency tree.
[workspace]

[dependencies]
iced = { version = "0.14", features = ["canvas"] }
serde_json = "1.0"
flow-paths = { path = "../flow-paths" }

# Linux-only, and the only dependency here that is: evdev is the chord picker
# reading /dev/input. Keeping it off other platforms is what lets the window
# build on a Mac for design work - see the `chord` module in main.rs.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[[bin]]
name = "flow-console"
path = "src/main.rs"
